name: Drift CI (dogfood)

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Docs still match the code
    runs-on: ubuntu-latest
    steps:
      # The default merge checkout: HEAD is the merge commit, HEAD^1 the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # Runs the committed dist/action.js: rebuild and commit dist/ after changing src/.
      - uses: ./
